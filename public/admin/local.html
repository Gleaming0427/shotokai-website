<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — aperçu local</title>
  <style>
    [class*="editor"] img, [class*="Editor"] img, [data-slate-editor] img { max-width: 500px !important; max-height: 350px !important; height: auto !important; object-fit: contain !important; }
  </style>
  <script>
    // Empêche l'initialisation automatique : on injectera la config nous-mêmes
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://unpkg.com/decap-cms@3.6.1/dist/decap-cms.js"></script>
  <script>
    fetch('/admin/config.yml')
      .then(function (r) { return r.text(); })
      .then(function (yamlText) {
        var config = jsyaml.load(yamlText);
        // Backend de démo local : aucune connexion requise, aucune écriture sur le repo
        config.backend = { name: 'test-repo' };
        config.load_config_file = false;
        window.initCMS({ config: config });
      })
      .catch(function (err) {
        document.body.innerHTML =
          '<p style="font-family:sans-serif;padding:2rem;">Impossible de charger la configuration : ' + err.message + '</p>';
      });
  </script>
</body>
</html>
